# Polarity IQ — Curated FO Seed List
#
# This file is the human-curated discovery layer the brutal review insisted
# on. Each entry is a candidate family office I found mentioned in a public
# source. The seed citation is mandatory — it's the provenance for *why*
# this FO is in our list at all.
#
# Schema (per entry):
#   fo_id              short stable slug (snake_case), used as DB primary key
#   canonical_name     best guess at the legal entity name
#   aliases            list of other names this FO appears under
#   type               SFO | MFO | Trust | Holdco | Unknown
#   principal_family   surname(s) of the controlling family
#   hq_city            best-guess city (verified during enrich)
#   hq_country         country code (US, GB, CH, etc.)
#   hint_cik           SEC CIK if I already know it (zero-padded 10-digit string)
#   hint_foundation_ein  9-digit EIN of associated foundation, if I know it
#   seed_citations     LIST of (source, url) — where I personally found this
#                      FO mentioned. At least one required.
#   confidence         my a-priori confidence the FO exists + matches the
#                      profile, BEFORE curate.py runs verification:
#                        high   — well documented in major outlets / Wikipedia
#                        medium — known but coverage is sparse
#                        low    — I'm relying on a single source
#   notes              free text
#
# Curation rules:
#   - No FO appears in seeds.yaml without at least one seed_citation pointing
#     to a public source. Wikipedia is acceptable as a seed citation; primary
#     sources (SEC, IRS, official site) are added during enrichment.
#   - hint_cik and hint_foundation_ein are *hints* — curate.py verifies them
#     against live APIs and either confirms or rejects.
#   - The seed list is intentionally over-collected (60-80 candidates). The
#     final 50 are chosen by signal availability AFTER enrichment.

